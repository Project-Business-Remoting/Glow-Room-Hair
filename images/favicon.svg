<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond brun foncé arrondi — couleur principale du salon -->
  <rect width="100" height="100" rx="22" fill="#3b1f0c"/>

  <!-- Lettre G — Glow, en caramel -->
  <text
    x="28" y="64"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    fill="#c28448"
  >G</text>

  <!-- Accent caramel clair sous le G — rappel du trait divider du site -->
  <rect x="14" y="74" width="40" height="4" rx="2" fill="#d9a96e"/>

  <!-- Point décoratif caramel — rappel des tresses/locks -->
  <circle cx="72" cy="32" r="7" fill="#c28448" opacity="0.85"/>
  <circle cx="72" cy="52" r="5" fill="#d9a96e" opacity="0.7"/>
  <circle cx="72" cy="68" r="3.5" fill="#c28448" opacity="0.55"/>
</svg>
